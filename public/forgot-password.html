<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/base.css">
  <title>Reset your password | TH_AI</title>
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-top"><a class="logo" href="/" style="text-decoration:none">TH_AI</a></div>
    <main class="auth-main">
      <h1>Reset your password</h1>
      <p class="sub">Enter your email and we'll send you a link to choose a new password.</p>
      <form id="form" class="stack" novalidate>
        <div id="alert" class="alert" hidden role="alert"></div>
        <div class="field"><input id="email" type="email" placeholder="Email address" autocomplete="email" required></div>
        <button class="btn btn-primary" id="submit" type="submit">Send reset link</button>
      </form>
      <p class="switch"><a href="/login">Back to log in</a></p>
    </main>
    <footer class="auth-foot"><a href="/terms">Terms of use</a><span>|</span><a href="/privacy">Privacy Policy</a></footer>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="/js/config.js"></script>
  <script src="/js/supabase.js"></script>
  <script src="/js/auth.js"></script>
  <script>
    const form = document.getElementById('form'), alertEl = document.getElementById('alert');
    const email = document.getElementById('email'), submit = document.getElementById('submit');
    form.addEventListener('submit', async (e) => {
      e.preventDefault(); alertEl.hidden = true;
      if (!/^\S+@\S+\.\S+$/.test(email.value.trim())) return showAlert(alertEl, 'Please enter a valid email address.');
      setLoading(submit, true);
      const { error } = await sb.auth.resetPasswordForEmail(email.value.trim(), { redirectTo: location.origin + '/reset-password' });
      setLoading(submit, false, 'Send reset link');
      if (error && /rate limit|too many/i.test(error.message)) return showAlert(alertEl, friendlyError(error));
      // Same message whether or not the account exists, so emails can't be probed
      showAlert(alertEl, 'If an account exists for that email, a reset link is on its way. Check your inbox and spam folder.', true);
    });
  </script>
</body>
</html>
