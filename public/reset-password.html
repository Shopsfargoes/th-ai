<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/base.css">
  <title>Choose a new password | TH_AI</title>
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-top"><a class="logo" href="/" style="text-decoration:none">TH_AI</a></div>
    <main class="auth-main">
      <div id="checking" style="text-align:center"><span class="spinner"></span></div>

      <div id="expired" hidden>
        <h1>Link expired</h1>
        <p class="sub">This reset link is invalid or has expired.</p>
        <a class="btn btn-primary" href="/forgot-password" style="text-decoration:none">Request a new link</a>
      </div>

      <div id="formBox" hidden>
        <h1>Choose a new password</h1>
        <form id="form" class="stack" novalidate>
          <div id="alert" class="alert" hidden role="alert"></div>
          <div class="field">
            <input id="password" type="password" placeholder="New password (8+ characters)" autocomplete="new-password" required>
            <button type="button" class="toggle" id="toggle">Show</button>
          </div>
          <div class="field"><input id="confirm" type="password" placeholder="Confirm new password" autocomplete="new-password" required></div>
          <button class="btn btn-primary" id="submit" type="submit">Update password</button>
        </form>
      </div>
    </main>
    <footer class="auth-foot"><a href="/terms">Terms of use</a><span>|</span><a href="/privacy">Privacy Policy</a></footer>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="/js/config.js"></script>
  <script src="/js/supabase.js"></script>
  <script src="/js/auth.js"></script>
  <script>
    const el = (id) => document.getElementById(id);
    let shown = false;
    function showForm() { if (shown) return; shown = true; el('checking').hidden = true; el('formBox').hidden = false; }

    // The recovery link signs the user in temporarily so they can set a new password
    sb.auth.onAuthStateChange((event, s) => { if (event === 'PASSWORD_RECOVERY' || (event === 'SIGNED_IN' && s)) showForm(); });
    setTimeout(async () => {
      if (shown) return;
      const s = await Auth.session();
      if (s) showForm();
      else { el('checking').hidden = true; el('expired').hidden = false; }
    }, 2500);

    wirePasswordToggle(el('password'), el('toggle'));
    el('form').addEventListener('submit', async (e) => {
      e.preventDefault(); el('alert').hidden = true;
      const pw = el('password').value;
      if (pw.length < 8) return showAlert(el('alert'), 'Password must be at least 8 characters.');
      if (pw !== el('confirm').value) return showAlert(el('alert'), 'The two passwords do not match.');
      setLoading(el('submit'), true);
      const { error } = await sb.auth.updateUser({ password: pw });
      if (error) {
        setLoading(el('submit'), false, 'Update password');
        const same = /same|different/i.test(error.message);
        return showAlert(el('alert'), same ? 'Choose a password different from your old one.' : friendlyError(error));
      }
      showAlert(el('alert'), 'Password updated. Taking you to your account…', true);
      setTimeout(() => location.replace('/chat'), 1200);
    });
  </script>
</body>
</html>
