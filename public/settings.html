<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/base.css">
  <title>Settings | TH_AI</title>
  <style>
    .s-wrap { max-width: 640px; margin: 0 auto; padding: 0 20px 60px; }
    .s-nav { display: flex; align-items: center; justify-content: space-between; padding: 24px 0; }
    .s-nav a.link { color: var(--muted); font-size: .95rem; }
    h1 { font-size: 1.8rem; font-weight: 600; letter-spacing: -0.02em; margin: 8px 0 24px; }
    .card { border: 1px solid var(--border); border-radius: 16px; padding: 22px; margin-bottom: 16px; }
    .card h2 { margin: 0 0 14px; font-size: 1.05rem; font-weight: 600; }
    .card .stack { gap: 12px; }
    .card .btn { width: auto; height: 44px; padding: 0 22px; align-self: flex-start; }
    .field label { display: block; font-size: .82rem; color: var(--muted); margin-bottom: 5px; }
    .field input[readonly] { color: var(--muted); background: var(--bg-soft); }
    .row { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; font-size: .95rem; }
    .row span:first-child { color: var(--muted); }
    .bar { height: 6px; border-radius: 999px; background: var(--bg-hover); overflow: hidden; margin: 6px 0 4px; }
    .bar div { height: 100%; background: var(--accent); width: 0; transition: width .3s; }
    .hist { width: 100%; border-collapse: collapse; font-size: .9rem; }
    .hist td { padding: 9px 0; border-bottom: 1px solid var(--border); }
    .hist tr:last-child td { border-bottom: 0; }
    .hist td:last-child { text-align: right; }
    .pill { font-size: .72rem; font-weight: 600; padding: 2px 9px; border-radius: 999px; background: var(--bg-hover); color: var(--muted); }
    .pill.ok { background: color-mix(in srgb, var(--accent) 18%, transparent); color: var(--accent); }
    .pill.bad { background: var(--danger-bg); color: var(--danger); }
    .muted { color: var(--muted); font-size: .92rem; }
  </style>
</head>
<body>
  <div class="s-wrap">
    <nav class="s-nav">
      <a class="logo" href="/chat" style="text-decoration:none">TH_AI</a>
      <a class="link" href="/chat">Back to chat</a>
    </nav>
    <h1>Settings</h1>

    <section class="card">
      <h2>Profile</h2>
      <form id="profileForm" class="stack" novalidate>
        <div id="profileMsg" class="alert" hidden role="alert"></div>
        <div class="field"><label for="fullName">Name</label><input id="fullName" maxlength="80" placeholder="Your name"></div>
        <div class="field"><label for="email">Email</label><input id="email" readonly></div>
        <button class="btn btn-primary" type="submit">Save changes</button>
      </form>
    </section>

    <section class="card">
      <h2>Plan and usage</h2>
      <div id="planBox"><span class="muted">Loading…</span></div>
      <a class="btn btn-outline" href="/pricing" style="text-decoration:none;margin-top:14px;display:inline-flex;width:auto;height:44px;padding:0 22px">Manage plan</a>
    </section>

    <section class="card">
      <h2>Password</h2>
      <form id="pwForm" class="stack" novalidate>
        <div id="pwMsg" class="alert" hidden role="alert"></div>
        <div class="field"><label for="pw1">New password</label><input id="pw1" type="password" autocomplete="new-password" placeholder="8+ characters"></div>
        <div class="field"><label for="pw2">Confirm new password</label><input id="pw2" type="password" autocomplete="new-password"></div>
        <button class="btn btn-primary" type="submit">Update password</button>
      </form>
    </section>

    <section class="card">
      <h2>Payment history</h2>
      <div id="payBox"><span class="muted">Loading…</span></div>
    </section>

    <section class="card">
      <h2>Session</h2>
      <button class="btn btn-outline" id="logout" type="button" style="width:auto;height:44px;padding:0 22px">Log out</button>
    </section>

    <footer class="auth-foot"><a href="/terms">Terms of use</a><span>|</span><a href="/privacy">Privacy Policy</a></footer>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="/js/config.js"></script>
  <script src="/js/supabase.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/settings.js"></script>
</body>
</html>
