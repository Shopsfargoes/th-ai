<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/base.css">
  <title>Sign up | TH_AI</title>
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-top"><a class="logo" href="/" style="text-decoration:none">TH_AI</a></div>
    <main class="auth-main">
      <h1>Create your account</h1>
      <form id="form" class="stack" novalidate>
        <div id="alert" class="alert" hidden role="alert"></div>
        <div class="field"><input id="email" type="email" placeholder="Email address" autocomplete="email" required></div>
        <div class="field">
          <input id="password" type="password" placeholder="Password (8+ characters)" autocomplete="new-password" required>
          <button type="button" class="toggle" id="toggle">Show</button>
        </div>
        <button class="btn btn-primary" id="submit" type="submit">Continue</button>
      </form>
      <p class="switch">Already have an account? <a href="/login">Log in</a></p>
      <div class="divider">or</div>
      <div class="stack">
        <button class="btn btn-outline" id="google" type="button"><svg viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.2C12.4 13.7 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.6 5.9c4.5-4.1 7-10.2 7-17.6z"/><path fill="#FBBC05" d="M10.5 28.6A14.5 14.5 0 0 1 9.5 24c0-1.6.3-3.1.8-4.6l-7.9-6.2A24 24 0 0 0 0 24c0 3.9.9 7.5 2.6 10.8l7.9-6.2z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.6-5.9c-2.1 1.4-4.9 2.3-8.3 2.3-6.3 0-11.6-4.2-13.5-9.9l-7.9 6.2C6.5 42.6 14.6 48 24 48z"/></svg> Continue with Google</button>
      </div>
    </main>
    <footer class="auth-foot"><a href="/terms">Terms of use</a><span>|</span><a href="/privacy">Privacy Policy</a></footer>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="/js/config.js"></script>
  <script src="/js/supabase.js"></script>
  <script src="/js/auth.js"></script>
  <script>
    Auth.redirectIfAuthed();
    const form = document.getElementById('form'), alertEl = document.getElementById('alert');
    const email = document.getElementById('email'), password = document.getElementById('password');
    const submit = document.getElementById('submit');
    wirePasswordToggle(password, document.getElementById('toggle'));

    form.addEventListener('submit', async (e) => {
      e.preventDefault(); alertEl.hidden = true;
      if (!/^\S+@\S+\.\S+$/.test(email.value.trim())) return showAlert(alertEl, 'Please enter a valid email address.');
      if (password.value.length < 8) return showAlert(alertEl, 'Password must be at least 8 characters.');
      setLoading(submit, true);
      const { data, error } = await sb.auth.signUp({ email: email.value.trim(), password: password.value });
      if (error) { setLoading(submit, false, 'Continue'); return showAlert(alertEl, friendlyError(error)); }
      if (data.session) return location.replace('/chat');
      // Email confirmation is on: no session until the user confirms
      setLoading(submit, false, 'Continue');
      showAlert(alertEl, 'Check your email to confirm your account, then log in.', true);
    });

    document.getElementById('google').addEventListener('click', async () => {
      alertEl.hidden = true;
      const { error } = await Auth.google();
      if (error) showAlert(alertEl, friendlyError(error));
    });
  </script>
</body>
</html>
