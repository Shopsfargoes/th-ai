<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/base.css">
  <title>Page not found | TH_AI</title>
  <style>
    .nf { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 24px; }
    .nf .code { font-size: 4.5rem; font-weight: 600; letter-spacing: -0.04em; color: var(--accent); line-height: 1; }
    .nf h1 { font-size: 1.6rem; font-weight: 600; margin: 14px 0 6px; letter-spacing: -0.02em; }
    .nf p { color: var(--muted); margin: 0 0 24px; }
    .nf .btn { width: auto; padding: 0 28px; text-decoration: none; }
  </style>
</head>
<body>
  <div class="nf">
    <a class="logo" href="/" style="text-decoration:none;margin-bottom:28px">TH_AI</a>
    <div class="code">404</div>
    <h1>Page not found</h1>
    <p>The page you are looking for does not exist or has moved.</p>
    <a class="btn btn-primary" href="/">Go to home</a>
  </div>
</body>
</html>
