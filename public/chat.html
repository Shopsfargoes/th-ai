<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/chat.css">
  <title>TH_AI</title>
</head>
<body>
  <div class="app" id="app" hidden>
    <aside class="sidebar" id="sidebar">
      <div class="top"><span class="logo" style="font-size:1.2rem">TH_AI</span></div>
      <button class="new-chat" id="newChat">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
        New chat
      </button>
      <div class="convo-head">
        <span class="convo-label">Your conversations</span>
        <button class="link-btn" id="clearAll">Clear all</button>
      </div>
      <div class="convos" id="convos"><div class="convo-empty">No conversations yet</div></div>
      <div class="user-row">
        <div class="menu" id="menu" hidden><button id="logout">Log out</button></div>
        <button class="user-btn" id="userBtn"><span class="avatar" id="avatar"></span><span class="user-name" id="userName"></span></button>
      </div>
    </aside>
    <div class="scrim" id="scrim"></div>

    <section class="main">
      <div class="topbar">
        <button class="icon-btn" id="burger" aria-label="Open menu">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
      </div>

      <div class="messages" id="messages">
        <div class="hero" id="hero"><h2 id="greeting">How can I help you today?</h2></div>
        <div class="thread" id="thread" hidden></div>
      </div>

      <div class="composer-wrap dock">
        <div class="composer">
          <textarea id="prompt" rows="1" placeholder="Ask anything"></textarea>
          <button class="send" id="send" disabled aria-label="Send">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
          </button>
        </div>
        <div class="footnote">TH_AI can make mistakes. Check important information.</div>
      </div>
    </section>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="/js/config.js"></script>
  <script src="/js/supabase.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/chat.js"></script>
</body>
</html>
